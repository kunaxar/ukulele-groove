name: Build Flutter web
on:
  push:
    paths: ['.github/workflows/expand.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project source
        run: |
          python3 - <<'PY'
          import base64,gzip,json,pathlib
          files=json.loads(gzip.decompress(base64.b64decode('')))
          for name,text in files.items():
            p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Test and build
        run: |
          python3 web/generate_audio.py
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --base-href /ukulele-groove/ --no-wasm-dry-run
          rm -rf docs
          cp -r build/web docs
          touch docs/.nojekyll
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m 'Add Flutter project and web release'
          git push
