name: Import Flutter project
on:
  push:
    paths: ['project-bootstrap.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source and release build
        run: |
          unzip -o project-bootstrap.zip
          rm project-bootstrap.zip
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m 'Add complete Flutter source and tested web release'
          git push
