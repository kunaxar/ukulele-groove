name: Flutter checks and web build
on:
  push:
    paths: ['lib/**','web/**','test/**','pubspec*','.github/workflows/expand.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Test and build
        run: |
          python3 web/generate_audio.py
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --base-href /ukulele-groove/ --no-wasm-dry-run
          rm -rf docs
          cp -r build/web docs
          touch docs/.nojekyll
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs web/audio.json web/clips
          git diff --cached --quiet || git commit -m 'Update tested Flutter web release'
          git push
