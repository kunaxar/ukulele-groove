name: Flutter checks and web build
on:
  push:
    paths: ['lib/**','web/**','test/**','pubspec*','.github/workflows/expand.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flutter-web
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Fetch reviewed source release
        run: |
          curl --fail --location --max-time 60 'https://uke-converter-test.iy8cnl.workers.dev/ukulele-source-release.tar.gz' -o /tmp/uke-source.tar.gz
          echo 'd63863ec4c5fda2013d2836cbc5dc87cbb5e2829e9d3b5c5a57277e2daf988c5  /tmp/uke-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/uke-source.tar.gz
      - name: Test and build
        run: |
          python3 web/generate_audio.py
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --base-href /ukulele-groove/ --no-wasm-dry-run
          rm -rf docs
          cp -r build/web docs
          touch docs/.nojekyll
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs lib test web backend LICENSE THIRD-PARTY-NOTICES.md README.md
          git add -u
          git diff --cached --quiet || git commit -m 'Update tested Flutter web release'
          git pull --rebase origin main
          git push
